<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  {{canonical}}
  {{robots}}
  <meta name="theme-color" content="#f2ead8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1f" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sword &amp; Seal: Realm of Mist">
  <meta property="og:title" content="{{ogTitle}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{cfg.origin}}/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Sword &amp; Seal: Realm of Mist. A swordsman stands under a vermilion paifang gate in misty Cloudmist Valley.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ogTitle}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{cfg.origin}}/og.jpg">
  <link rel="preload" href="{{asset:fonts/ma-shan-zheng-latin-400-normal.woff2}}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{asset:fonts/noto-serif-latin-400-normal.woff2}}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{asset:css/site.css}}">
</head>
<body class="page-{{page}} {{bodyClass}}">
  {{include:header}}
  <main id="main" tabindex="-1">
{{content}}
  </main>
  {{include:footer}}
  <script src="{{asset:js/config.js}}" defer></script>
  <script src="{{asset:js/site.js}}" defer></script>
  {{scripts}}
</body>
</html>
